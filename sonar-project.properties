sonar.test.inclusions=**/*_test.go,**/*.test.*,**/*.spec.*,**/__tests__/**,frontend/src/setupTests.ts,frontend/e2e/**,frontend/__mocks__/**,frontend/jest.config.cjs,frontend/playwright.config.ts
